<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillBridge - Freelance Guide</title>
  <style>
    :root {
      --bg-primary: #0a0a0a; --bg-card: #121212; --border-color: #262626;
      --text-primary: #ffffff; --text-secondary: #a1a1aa; --accent-white: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 32px; width: 100%; max-width: 650px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
    h2 { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; color: var(--accent-white); }
    .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 24px; }
    .content-box { background: #18181b; border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin: 20px 0; line-height: 1.6; font-size: 0.95rem; }
    .content-box ul { padding-left: 20px; margin-top: 10px; }
    .content-box li { margin-bottom: 8px; color: #e4e4e7; }
    .btn { display: block; width: 100%; padding: 14px; background: var(--accent-white); color: #000; border: none; border-radius: 10px; font-weight: 700; text-align: center; text-decoration: none; transition: 0.2s; }
    .btn:hover { background: #e4e4e7; }
    @media (max-width: 480px) { body { padding: 12px; } .container { padding: 20px; } }
  </style>
</head>
<body>

  <div class="container">
    <h2>Freelance Readiness</h2>
    <p class="subtitle">Actionable strategies for securing initial client projects.</p>

    <div id="freelance-output" class="content-box">
      <p>⏳ <i>Loading freelancing roadmap...</i></p>
    </div>

    <a href="index.html" class="btn">Restart Track ↺</a>
  </div>

  <script type="module" src="js/freelance.js"></script>
  <script type="module" src="js/mentor.js"></script>
</body>
</html>
