<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillBridge - Learning Roadmap</title>
  <style>
    :root {
      --bg-primary: #0a0a0a; --bg-card: #121212; --border-color: #262626;
      --text-primary: #ffffff; --text-secondary: #a1a1aa; --accent-white: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 32px; width: 100%; max-width: 650px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
    
    /* Header layout with Download button */
    .header-flex { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; margin-bottom: 24px; }
    h2 { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; color: var(--accent-white); }
    .subtitle { color: var(--text-secondary); font-size: 0.9rem; }
    
    .download-btn {
      padding: 8px 14px;
      background: var(--accent-white);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.2s;
    }
    .download-btn:hover { background: #e4e4e7; }

    .content-box { background: #18181b; border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin: 20px 0; line-height: 1.6; font-size: 0.95rem; }
    .content-box ul { padding-left: 20px; margin-top: 10px; }
    .content-box li { margin-bottom: 8px; color: #e4e4e7; }
    .btn { display: block; width: 100%; padding: 14px; background: var(--accent-white); color: #000; border: none; border-radius: 10px; font-weight: 700; text-align: center; text-decoration: none; transition: 0.2s; }
    .btn:hover { background: #e4e4e7; }
    @media (max-width: 480px) { body { padding: 12px; } .container { padding: 20px; } .header-flex { flex-direction: column; } }
  </style>
</head>
<body>

  <div class="container" id="pdf-content">
    <div class="header-flex">
      <div>
        <h2 id="welcome-header">Learning Roadmap</h2>
        <p class="subtitle" id="user-status">Analyzing track parameters...</p>
      </div>
      <button id="download-pdf-btn" class="download-btn">📄 Download PDF</button>
    </div>

    <div id="roadmap-output" class="content-box">
      <p>⏳ <i>Generating your customized roadmap...</i></p>
    </div>

    <a href="projects.html" id="next-btn" class="btn" style="display: none;">Continue to Projects ➔</a>
  </div>

  <script type="module" src="js/roadmap.js"></script>
  <script type="module" src="js/mentor.js"></script>

  <!-- PDF Export Script Handler -->
  <script>
    document.getElementById("download-pdf-btn").addEventListener("click", () => {
      const element = document.getElementById("pdf-content");
      const downloadBtn = document.getElementById("download-pdf-btn");
      
      // Temporary hide button in PDF export
      downloadBtn.style.display = "none";

      const opt = {
        margin:       10,
        filename:     'SkillBridge_Roadmap.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, backgroundColor: '#0a0a0a' },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        downloadBtn.style.display = "block";
      });
    });
  </script>
</body>
</html>
