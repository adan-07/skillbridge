<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillBridge - AI Mentor</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-color: #6366f1;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

    body {
      background: radial-gradient(circle at top left, #1e1b4b, var(--bg-color));
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .chat-container {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 650px;
      height: 80vh;
      display: flex;
      flex-direction: column;
    }

    h2 { text-align: center; margin-bottom: 15px; }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--accent-color);
      color: white;
    }

    .msg.ai {
      align-self: flex-start;
      background: #334155;
      color: #f8fafc;
    }

    .chat-form {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: white;
      outline: none;
    }

    button {
      padding: 12px 20px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <h2>💬 SkillBridge AI Mentor</h2>
    <div id="chat-box" class="chat-box">
      <div class="msg ai">Hello! Ask me anything about your learning roadmap or technical concepts.</div>
    </div>

    <form id="chat-form" class="chat-form">
      <input type="text" id="user-input" placeholder="Type your question..." required>
      <button type="submit">Send</button>
    </form>
  </div>

  <script type="module" src="js/mentor.js"></script>
</body>
</html>
